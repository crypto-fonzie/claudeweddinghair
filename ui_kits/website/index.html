<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polished &amp; Pinned — Bridal Hair by Noelle</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Work.jsx"></script>
<script type="text/babel" src="Morning.jsx"></script>
<script type="text/babel" src="Enquire.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [ready, setReady] = React.useState(!!window.Home);
  React.useEffect(() => { if (ready) return; const t = setInterval(() => { if (window.Home) { clearInterval(t); setReady(true); } }, 30); return () => clearInterval(t); }, [ready]);
  const [screen, setScreen] = React.useState("home");
  if (!ready) return null;
  const go = (id) => { setScreen(id); window.scrollTo(0, 0); };
  const Screen = { home: window.Home, work: window.Work, morning: window.Morning, enquire: window.Enquire }[screen] || window.Home;
  return <Screen go={go} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
