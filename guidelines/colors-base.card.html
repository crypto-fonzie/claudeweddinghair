<!-- @dsCard group="Colors" viewport="700x190" name="The six" subtitle="Warm neutrals only. Ink is a brown, never #000." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line-hairline);border:1px solid var(--line-hairline)}.sw>div{padding:0}.chip{height:56px}.meta{background:var(--morning);padding:9px 10px 11px}.nm{font-family:var(--font-display);font-size:15px;line-height:1.1}.hx{font-size:10px;letter-spacing:.12em;color:var(--tortoise);margin-top:3px}.use{font-size:10px;color:var(--ink-60);margin-top:5px;line-height:1.35}</style></head><body>
<div class="sw">
<div><div class="chip" style="background:var(--morning)"></div><div class="meta"><div class="nm">Morning</div><div class="hx">#EFEDE7</div><div class="use">Base background</div></div></div>
<div><div class="chip" style="background:var(--tulle)"></div><div class="meta"><div class="nm">Tulle</div><div class="hx">#DEDAD1</div><div class="use">Cards, blocks</div></div></div>
<div><div class="chip" style="background:var(--brass)"></div><div class="meta"><div class="nm">Brass</div><div class="hx">#B98B4A</div><div class="use">Pin, hairlines</div></div></div>
<div><div class="chip" style="background:var(--tortoise)"></div><div class="meta"><div class="nm">Tortoise</div><div class="hx">#6E4A2C</div><div class="use">Subheads, labels</div></div></div>
<div><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="nm">Ink</div><div class="hx">#241E19</div><div class="use">Body, dark panels</div></div></div>
<div><div class="chip" style="background:var(--sage)"></div><div class="meta"><div class="nm">Sage</div><div class="hx">#9DA391</div><div class="use">One per page, max</div></div></div>
</div>
</body></html>
