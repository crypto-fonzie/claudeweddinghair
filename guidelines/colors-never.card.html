<!-- @dsCard group="Colors" viewport="700x170" name="Never" subtitle="No pink, no pure black, no gradient, no glow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.b{border:1px solid var(--line-hairline);padding:0}.c{height:52px}.w{font-size:11px;line-height:1.4;color:var(--tortoise);padding:10px 12px}.x{font-family:var(--font-display);font-size:15px;color:var(--brass)}</style></head><body>
<div class="g">
<div class="b"><div class="c" style="background:#E8B4C8"></div><div class="w"><span class="x">—</span> Blush, or any pink. Honey, not blush.</div></div>
<div class="b"><div class="c" style="background:#000"></div><div class="w"><span class="x">—</span> Pure black. Ink is a warm brown.</div></div>
<div class="b"><div class="c" style="background:linear-gradient(120deg,#B98B4A,#6E4A2C)"></div><div class="w"><span class="x">—</span> Gradients of any kind.</div></div>
<div class="b"><div class="c" style="background:var(--tulle);box-shadow:inset 0 0 22px rgba(0,0,0,.35)"></div><div class="w"><span class="x">—</span> Shadows, glows, blur.</div></div>
</div>
</body></html>
