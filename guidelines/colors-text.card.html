<!-- @dsCard group="Colors" viewport="700x210" name="Text roles" subtitle="Brass is never body text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}.r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-faint)}.k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40);font-weight:500;white-space:nowrap}</style></head><body>
<div class="g">
<div class="r"><span style="color:var(--ink);font-size:15px">Body copy — Ink</span><span class="k">--text-body</span></div>
<div class="r"><span style="color:var(--tortoise);font-size:15px">Secondary — Tortoise</span><span class="k">--text-secondary</span></div>
<div class="r"><span style="color:var(--ink-60);font-size:15px">Muted — Ink 60%</span><span class="k">--text-muted</span></div>
<div class="r"><span style="color:var(--brass);font-family:var(--font-display);font-size:19px">Accent — Brass, display only</span><span class="k">--text-accent</span></div>
<div class="r"><span style="color:var(--tortoise);font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500">Label — Tortoise</span><span class="k">--text-label</span></div>
<div class="r" style="background:var(--ink);padding:9px 10px;border:0"><span style="color:var(--morning);font-size:15px">On inverse — Morning</span><span class="k" style="color:var(--brass)">--text-on-inverse</span></div>
</div>
</body></html>
