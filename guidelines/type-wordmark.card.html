<!-- @dsCard group="Type" viewport="700x210" name="Wordmark tracking" subtitle="0.30em / 0.60em so both lines finish at the same width" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.st{display:flex;gap:46px;align-items:center;justify-content:center;flex-wrap:wrap}.lk{font-family:var(--font-display);text-transform:uppercase;text-align:center;line-height:1;font-size:30px}.l1{display:block;letter-spacing:.30em;text-indent:.30em}.amp{display:block;font-style:italic;text-transform:none;color:var(--brass);letter-spacing:0;text-indent:0;font-size:23px;margin:.14em 0}.l2{display:block;letter-spacing:.60em;text-indent:.60em}.bad .l1,.bad .l2{letter-spacing:.30em;text-indent:.30em}.cap{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--tortoise);text-align:center;margin-top:16px;font-weight:500}</style></head><body>
<div class="st">
<div><div class="lk"><span class="l1">Polished</span><span class="amp">&amp;</span><span class="l2">Pinned</span></div><div class="cap">Right · .30em / .60em</div></div>
<div style="opacity:.45"><div class="lk bad"><span class="l1">Polished</span><span class="amp">&amp;</span><span class="l2">Pinned</span></div><div class="cap">Wrong · set identically</div></div>
</div>
</body></html>
