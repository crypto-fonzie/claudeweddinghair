<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.g{display:grid;grid-template-columns:1fr 1fr;gap:30px}.k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tortoise);font-weight:500;margin:0 0 6px}.sq{display:flex;gap:12px;margin-top:6px}.sq div{width:62px;height:44px;background:var(--tulle);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--tortoise);letter-spacing:.1em}</style></head><body>
<div class="g">
<div>
<p class="k">Hairline · tortoise 18%</p><hr style="border:0;border-top:1px solid var(--line-hairline);margin:0 0 16px">
<p class="k">Faint · tortoise 9%</p><hr style="border:0;border-top:1px solid var(--line-faint);margin:0 0 16px">
<p class="k">Brass · row rule</p><hr style="border:0;border-top:1px solid var(--brass);margin:0">
</div>
<div>
<p class="k">Corner radius</p>
<div class="sq"><div>0px</div><div style="border-radius:6px;opacity:.35">6px</div><div style="border-radius:999px;opacity:.35">pill</div></div>
<p style="font-size:11px;color:var(--ink-60);margin-top:12px;max-width:30ch">Square everything — cards, images, buttons, inputs, tiles. The only circle is the platform avatar crop.</p>
</div>
</div>
</body></html>
