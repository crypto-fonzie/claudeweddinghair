<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces" subtitle="Depth is Tulle on Morning — never a shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.panel{padding:22px 20px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}.t{font-family:var(--font-display);font-size:22px}.l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}</style></head><body>
<div class="row">
<div class="panel" style="background:var(--morning);border:1px solid var(--line-hairline)"><span class="l" style="color:var(--tortoise)">Surface · page</span><span class="t">Morning</span></div>
<div class="panel" style="background:var(--tulle)"><span class="l" style="color:var(--tortoise)">Surface · block</span><span class="t">Tulle</span></div>
<div class="panel" style="background:var(--ink);color:var(--morning)"><span class="l" style="color:var(--brass)">Surface · inverse</span><span class="t">Ink<span style="color:var(--ink-raised);background:var(--ink-raised);margin-left:10px;padding:0 12px">·</span></span></div>
</div>
</body></html>
